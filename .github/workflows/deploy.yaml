
name: Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # STEP 1: Configure secure SSH
      - name: Configure SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          EXPECTED_FP: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail

          : "${VPS_HOST:?VPS_HOST missing}"
          : "${VPS_USER:?VPS_USER missing}"
          : "${VPS_SSH_KEY:?VPS_SSH_KEY missing}"
          : "${EXPECTED_FP:?VPS_HOST_FINGERPRINT missing}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Store private key securely
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Fetch only the ED25519 host key
          echo "Scanning VPS ED25519 host key..."

          ssh-keyscan -T 15 -p 22 -t ed25519 \
            "$VPS_HOST" 2>/dev/null \
            > /tmp/vps_host_keys || true

          if [ ! -s /tmp/vps_host_keys ]; then
            echo "ERROR: Could not fetch ED25519 host key"
            exit 1
          fi

          # Trust only keys matching verified fingerprint
          : > ~/.ssh/known_hosts_deploy

          while IFS= read -r hostkey; do
            fingerprint=$(printf '%s\n' "$hostkey" |
              ssh-keygen -lf - -E sha256 |
              awk '{print $2}')

            if [ "$fingerprint" = "$EXPECTED_FP" ]; then
              printf '%s\n' "$hostkey" \
                >> ~/.ssh/known_hosts_deploy
            fi
          done < /tmp/vps_host_keys

          if [ ! -s ~/.ssh/known_hosts_deploy ]; then
            echo "ERROR: ED25519 fingerprint mismatch"
            exit 1
          fi

          chmod 600 ~/.ssh/known_hosts_deploy

          echo "ED25519 fingerprint verified successfully"

      # STEP 2: Test SSH connection
      - name: Test SSH Connection
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts_deploy" \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=30 \
            -p 22 \
            "$VPS_USER@$VPS_HOST" \
            "echo 'SSH connection successful'; whoami"

      # STEP 3: Deploy backend
      - name: Deploy to VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          timeout 10m ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts_deploy" \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=30 \
            -p 22 \
            "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'

          set -euo pipefail

          echo "Starting deployment..."

          cd /var/www/zeptac/data/www/vividapi.zeptac.com/vivid_backend

          echo "Fetching latest changes..."
          git fetch origin main
          git reset --hard origin/main

          echo "Installing dependencies..."
          npm ci --omit=dev

          echo "Restarting PM2..."
          pm2 restart vivid --update-env

          echo "Deployment completed successfully!"

          REMOTE

      # STEP 4: Clean up credentials
      - name: Clean up SSH credentials
        if: always()
        shell: bash
        run: |
          rm -f ~/.ssh/deploy_key
          rm -f ~/.ssh/known_hosts_deploy
          rm -f /tmp/vps_host_keys
