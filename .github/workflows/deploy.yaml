name: Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate SSH Configuration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_HOST" || {
            echo "ERROR: VPS_HOST missing"
            exit 1
          }

          test -n "$VPS_USER" || {
            echo "ERROR: VPS_USER missing"
            exit 1
          }

          test -n "$VPS_SSH_KEY" || {
            echo "ERROR: VPS_SSH_KEY missing"
            exit 1
          }

          if [[ "$VPS_HOST" =~ [[:space:]/:] ]]; then
            echo "ERROR: VPS_HOST has an invalid format"
            exit 1
          fi

          echo "SSH secrets are configured"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          port: 22
          command_timeout: 10m
          script: |
            set -e

            echo "Starting deployment..."

            cd /var/www/zeptac/data/www/vividapi.zeptac.com/vivid_backend

            echo "Fetching changes..."
            git fetch origin main
            git reset --hard origin/main

            echo "Installing dependencies..."
            npm ci --omit=dev

            echo "Restarting backend..."
            pm2 restart vivid --update-env

            echo "Deployment successful!"